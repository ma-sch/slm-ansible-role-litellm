---
# tasks file for litellm
### Inputs:
- name: LITELLM | Assert inputs | main.yml
  ansible.builtin.assert:
    that:
      - (slm_ansible_role_litellm_docker_compose_dir is defined) and (slm_ansible_role_litellm_docker_compose_dir | length > 0)
      - (slm_ansible_role_litellm_config_dir is defined) and (slm_ansible_role_litellm_config_dir | length > 0)

### Optional Inputs:
# - slm_ansible_role_litellm_version: version of LiteLLM docker image (default: "v1.98.0")
# - slm_ansible_role_litellm_config_yaml: dict with LiteLLM proxy configuration (default: {})
# - slm_ansible_role_litellm_public_port: public port for LiteLLM service (default: 4000)
# - slm_ansible_role_litellm_compose_project_name: Docker Compose project name (default: "", uses Compose default)
# - slm_ansible_role_litellm_service_networks: dict rendered under services.litellm.networks — full network+alias config per network (default: {})
# - slm_ansible_role_litellm_compose_networks: dict rendered under top-level networks — use to declare external networks (default: {})
# - slm_ansible_role_litellm_master_key: pre-defined LiteLLM master key; takes priority over existing .env and auto-generation (default: "")
# - slm_ansible_role_litellm_salt_key: pre-defined LiteLLM salt key; takes priority over existing .env and auto-generation (default: "")
### Outputs:
# - slm_ansible_role_litellm_resolved_master_key: effective master key used for this deployment (no_log: true)
# - slm_ansible_role_litellm_resolved_salt_key: effective salt key used for this deployment (no_log: true)

- name: LITELLM | Ensure LiteLLM directories exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0777"
  loop:
    - "{{ slm_ansible_role_litellm_docker_compose_dir }}"
    - "{{ slm_ansible_role_litellm_config_dir }}"

- name: LITELLM | Check whether LiteLLM .env exists
  ansible.builtin.stat:
    path: "{{ slm_ansible_role_litellm_docker_compose_dir }}/.env"
  register: litellm_env_file_stat
  changed_when: false

- name: LITELLM | Read existing LiteLLM .env file
  when: litellm_env_file_stat.stat.exists
  ansible.builtin.slurp:
    path: "{{ slm_ansible_role_litellm_docker_compose_dir }}/.env"
  register: litellm_env_file_content
  no_log: true

- name: LITELLM | Set keys from existing .env
  ansible.builtin.set_fact:
    litellm_master_key_file: >-
      {{
        (
          (litellm_env_file_content.content | default('') | b64decode)
          | regex_findall('(?m)^LITELLM_MASTER_KEY=(.+)$')
          | first
          | default('')
        )
      }}
    litellm_salt_key_file: >-
      {{
        (
          (litellm_env_file_content.content | default('') | b64decode)
          | regex_findall('(?m)^LITELLM_SALT_KEY=(.+)$')
          | first
          | default('')
        )
      }}
  changed_when: false
  no_log: true

- name: LITELLM | Resolve effective LiteLLM keys
  ansible.builtin.set_fact:
    litellm_master_key: >-
      {{
        slm_ansible_role_litellm_master_key
        if (slm_ansible_role_litellm_master_key | length > 0)
        else (
          litellm_master_key_file
          if (litellm_master_key_file | length > 0)
          else 'sk-' ~ lookup('password', '/dev/null length=32 chars=ascii_letters,digits')
        )
      }}
    litellm_salt_key: >-
      {{
        slm_ansible_role_litellm_salt_key
        if (slm_ansible_role_litellm_salt_key | length > 0)
        else (
          litellm_salt_key_file
          if (litellm_salt_key_file | length > 0)
          else 'sk-' ~ lookup('password', '/dev/null length=32 chars=ascii_letters,digits')
        )
      }}
  changed_when: false
  no_log: true

- name: LITELLM | Expose resolved keys to calling playbook
  ansible.builtin.set_fact:
    slm_ansible_role_litellm_resolved_master_key: "{{ litellm_master_key }}"
    slm_ansible_role_litellm_resolved_salt_key: "{{ litellm_salt_key }}"
  changed_when: false
  no_log: true

- name: LITELLM | Render LiteLLM docker-compose file from bundled template
  ansible.builtin.template:
    src: litellm-compose.yml.j2
    dest: "{{ slm_ansible_role_litellm_docker_compose_dir }}/litellm.yml"
    mode: "0644"

- name: LITELLM | Create LiteLLM .env file with resolved keys
  ansible.builtin.copy:
    dest: "{{ slm_ansible_role_litellm_docker_compose_dir }}/.env"
    mode: "0600"
    content: |
      LITELLM_MASTER_KEY={{ litellm_master_key }}
      LITELLM_SALT_KEY={{ litellm_salt_key }}
  no_log: true

- name: LITELLM | Remove stale directory stub at config file path
  ansible.builtin.file:
    path: "{{ slm_ansible_role_litellm_config_dir }}/litellm_config.yaml"
    state: absent

- name: LITELLM | Render LiteLLM config to target host
  ansible.builtin.template:
    src: litellm_config.yaml.j2
    dest: "{{ slm_ansible_role_litellm_config_dir }}/litellm_config.yaml"
    mode: "0644"
  register: config_file_copy

- name: LITELLM | Create LiteLLM compose override for config mount
  ansible.builtin.copy:
    dest: "{{ slm_ansible_role_litellm_docker_compose_dir }}/litellm.override.yml"
    mode: "0644"
    content: |
      services:
        litellm:
          command: ["--config", "/app/config.yaml"]
          ports:
            - "{{ slm_ansible_role_litellm_public_port | default(4000) }}:4000"
          volumes:
            - {{ slm_ansible_role_litellm_config_dir }}/litellm_config.yaml:/app/config.yaml:ro
          healthcheck:
            test: ["CMD-SHELL", "curl http://localhost:4000"]
            interval: 5s
            timeout: 5s
            retries: 10
          networks:
            litellm_internal: {}
      {% if slm_ansible_role_litellm_service_networks | length > 0 %}
            {{ slm_ansible_role_litellm_service_networks | to_nice_yaml(indent=2) | indent(12) }}
      {% endif %}
        db:
          networks:
            litellm_internal:
              aliases:
                - db
      networks:
        litellm_internal:
          internal: true
      {% if slm_ansible_role_litellm_compose_networks | length > 0 %}
        {{ slm_ansible_role_litellm_compose_networks | to_nice_yaml(indent=2) | indent(8) }}
      {% endif %}
  register: override_file_creation

- name: LITELLM | Start LiteLLM with Docker Compose
  when: override_file_creation is changed or config_file_copy is changed
  community.docker.docker_compose_v2:
    project_src: "{{ slm_ansible_role_litellm_docker_compose_dir }}"
    project_name: "{{ slm_ansible_role_litellm_compose_project_name | default(omit, true) }}"
    files:
      - litellm.yml
      - litellm.override.yml
    state: present
